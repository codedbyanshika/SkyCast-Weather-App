<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101b45, #354b91, #8b72bd);
            color: white;
            padding: 35px 20px;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .tagline {
            color: #d5d9f5;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: 1px solid #ffffff55;
            border-radius: 14px;
            background: #ffffff18;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            background: #f5c86b;
            color: #17234c;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffda8a;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            min-height: 22px;
            margin-bottom: 15px;
            color: #f5d58c;
            font-size: 14px;
        }

        .weather-card {
            background: #ffffff18;
            border: 1px solid #ffffff35;
            border-radius: 25px;
            padding: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 40px #00000020;
            backdrop-filter: blur(12px);
        }

        .location {
            color: #e2e5ff;
            font-size: 18px;
        }

        .temperature {
            font-size: 75px;
            font-weight: bold;
            margin: 15px 0;
        }

        .condition {
            font-size: 20px;
            color: #f5d58c;
        }

        .weather-icon {
            font-size: 115px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .section-title {
            margin: 30px 0 18px;
            font-size: 21px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .detail-card {
            background: #ffffff18;
            border: 1px solid #ffffff25;
            border-radius: 18px;
            padding: 22px;
        }

        .detail-card p {
            color: #d5d9f5;
            margin-bottom: 12px;
        }

        .detail-card h3 {
            font-size: 23px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #d5d9f5;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .weather-card {
                padding: 24px;
            }

            .temperature {
                font-size: 55px;
            }

            .weather-icon {
                font-size: 75px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .tagline {
                display: none;
            }

            .search-box button {
                padding: 14px 16px;
            }
        }
    
/* WEATHER WORLD */

.weather-scene {
    position: relative;
    height: 230px;
    margin-top: 22px;
    overflow: hidden;
    border-radius: 25px;
    border: 1px solid #ffffff35;
    background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
    box-shadow: 0 15px 35px #00000025;
    perspective: 700px;
    transition: background 1s ease;
}

.weather-scene > div {
    position: absolute;
}

.scene-caption {
    bottom: 18px;
    left: 20px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 2px 8px #3338;
    z-index: 5;
}

.scene-sun {
    top: 25px;
    right: 65px;
    font-size: 55px;
    animation: sun-glow 3s infinite alternate;
}

.scene-cloud {
    top: 30px;
    left: 12%;
    font-size: 65px;
    animation: cloud-float 7s ease-in-out infinite;
}

.scene-lemonade {
    display: none;
    top: 75px;
    left: 43%;
    font-size: 65px;
    animation: lemonade-bounce 2s ease-in-out infinite;
}

.scene-frog {
    display: none;
    bottom: 42px;
    font-size: 45px;
    animation: frog-hop 2s ease-in-out infinite;
}

.frog-one {
    left: 30%;
}

.frog-two {
    right: 25%;
    animation-delay: 0.8s;
}

.scene-flower {
    display: none;
    bottom: 35px;
    font-size: 38px;
    transform-origin: bottom;
    animation: flower-sway 3s ease-in-out infinite;
}

.flower-one { left: 20%; }
.flower-two { left: 48%; animation-delay: 0.5s; }
.flower-three { right: 18%; animation-delay: 1s; }

.scene-butterfly {
    display: none;
    font-size: 30px;
    animation: butterfly-fly 5s ease-in-out infinite;
}

.butterfly-one {
    top: 50px;
    left: 25%;
}

.butterfly-two {
    top: 85px;
    right: 20%;
    animation-delay: 1.5s;
}

.scene-rain {
    display: none;
    inset: 0;
    font-size: 28px;
    letter-spacing: 20px;
    text-align: center;
    padding-top: 35px;
    opacity: 0.8;
    animation: rain-fall 1.5s linear infinite;
}

.scene-lightning {
    display: none;
    top: 30px;
    right: 30%;
    font-size: 55px;
    animation: lightning-flash 2s infinite;
}

/* WEATHER TYPES */

.weather-scene.sunny {
    background: linear-gradient(135deg, #f9d976, #f39f86);
}

.weather-scene.sunny .scene-lemonade {
    display: block;
}

.weather-scene.rainy {
    background: linear-gradient(135deg, #526b91, #879bb5);
}

.weather-scene.rainy .scene-frog,
.weather-scene.rainy .scene-rain {
    display: block;
}

.weather-scene.cloudy {
    background: linear-gradient(135deg, #8e9eab, #c4d1df);
}

.weather-scene.cloudy .scene-cloud {
    font-size: 90px;
}

.weather-scene.spring {
    background: linear-gradient(135deg, #a8e6cf, #dcedc1);
}

.weather-scene.spring .scene-flower,
.weather-scene.spring .scene-butterfly {
    display: block;
}

.weather-scene.storm {
    background: linear-gradient(135deg, #202b48, #53617a);
}

.weather-scene.storm .scene-rain,
.weather-scene.storm .scene-lightning {
    display: block;
}

/* ANIMATIONS */

@keyframes sun-glow {
    from { transform: scale(1); filter: drop-shadow(0 0 5px #fff); }
    to { transform: scale(1.12); filter: drop-shadow(0 0 18px #ffe58a); }
}

@keyframes cloud-float {
    0%, 100% { transform: translateX(0) translateY(0); }
    50% { transform: translateX(35px) translateY(8px); }
}

@keyframes lemonade-bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
}

@keyframes frog-hop {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-30px) rotate(-8deg); }
}

@keyframes flower-sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
}

@keyframes butterfly-fly {
    0%, 100% { transform: translate(0, 0) rotate(-10deg); }
    50% { transform: translate(30px, -35px) rotate(15deg); }
}

@keyframes rain-fall {
    0% { transform: translateY(-25px); }
    100% { transform: translateY(30px); }
}

@keyframes lightning-flash {
    0%, 85%, 100% { opacity: 0.2; }
    90% { opacity: 1; }
}

    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">☁ SkyCast</div>
        <div class="tagline">Discover the weather around you</div>
    </header>

    <form class="search-box" id="search-form">
        <input
            type="text"
            id="city-input"
            placeholder="Search your city..."
            autocomplete="off"
            required
        >

        <button type="submit" id="search-button">
            Search
        </button>
    </form>

    <p class="status" id="status"></p>

    <section class="weather-card">

        <div>
            <p class="location" id="location">
                New Delhi, India
            </p>

            <h1 class="temperature" id="temperature">
                --°C
            </h1>

            <p class="condition" id="condition">
                Loading...
            </p>
        </div>

        <div class="weather-icon" id="weather-icon">
            🌤️
        </div>

    </section>

    <h2 class="section-title">Today's Weather</h2>
    
<section id="weather-scene" class="weather-scene sunny">

    <div class="scene-cloud">☁️</div>
    <div class="scene-sun">☀️</div>

    <div class="scene-lemonade">🍋🥤</div>

    <div class="scene-frog frog-one">🐸</div>
    <div class="scene-frog frog-two">🐸</div>

    <div class="scene-flower flower-one">🌷</div>
    <div class="scene-flower flower-two">🌼</div>
    <div class="scene-flower flower-three">🌸</div>

    <div class="scene-butterfly butterfly-one">🦋</div>
    <div class="scene-butterfly butterfly-two">🦋</div>

    <div class="scene-rain">🌧️</div>
    <div class="scene-lightning">⚡</div>

    <div class="scene-caption" id="scene-caption">
        A little sunshine, a little happiness.
    </div>

</section>



    <section class="details">

        <div class="detail-card">
            <p>💧 Humidity</p>
            <h3 id="humidity">--%</h3>
        </div>

        <div class="detail-card">
            <p>💨 Wind Speed</p>
            <h3 id="wind">-- km/h</h3>
        </div>

        <div class="detail-card">
            <p>🌧️ Rain</p>
            <h3 id="rain">-- mm</h3>
        </div>

    </section>

    <footer>
        SkyCast | Your weather, your world.
    </footer>

</div>

<script>
    // WEATHER CONDITIONS
const conditions = {
    0: ["Clear Sky", "☀️"],
    1: ["Mainly Clear", "🌤️"],
    2: ["Partly Cloudy", "⛅"],
    3: ["Overcast", "☁️"],
    45: ["Foggy", "🌫️"],
    48: ["Foggy", "🌫️"],
    51: ["Light Drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy Drizzle", "🌧️"],
    56: ["Freezing Drizzle", "🌧️"],
    57: ["Freezing Drizzle", "🌧️"],
    61: ["Light Rain", "🌧️"],
    63: ["Moderate Rain", "🌧️"],
    65: ["Heavy Rain", "🌧️"],
    66: ["Freezing Rain", "🌧️"],
    67: ["Heavy Freezing Rain", "🌧️"],
    71: ["Light Snow", "❄️"],
    73: ["Moderate Snow", "❄️"],
    75: ["Heavy Snow", "❄️"],
    77: ["Snow Grains", "❄️"],
    80: ["Rain Showers", "🌦️"],
    81: ["Moderate Rain Showers", "🌧️"],
    82: ["Heavy Rain Showers", "🌧️"],
    85: ["Snow Showers", "🌨️"],
    86: ["Heavy Snow Showers", "🌨️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm with Hail", "⛈️"],
    99: ["Heavy Thunderstorm", "⛈️"]
};


// SHOW WEATHER INFORMATION
function showWeather(weather, cityName) {

    document.getElementById("location").textContent = cityName;

    document.getElementById("temperature").textContent =
        Math.round(weather.temperature_2m) + "°C";

    document.getElementById("humidity").textContent =
        weather.relative_humidity_2m + "%";

    document.getElementById("wind").textContent =
        weather.wind_speed_10m + " km/h";

    document.getElementById("rain").textContent =
        weather.precipitation + " mm";


    const code = Number(weather.weather_code);

    const info = conditions[code] || ["Unknown Weather", "🌤️"];

    document.getElementById("condition").textContent = info[0];

    document.getElementById("weather-icon").textContent = info[1];
    // SHOW 5 DAY FORECAST

function showForecast(data) {

    const forecast = document.getElementById("forecast");

    forecast.innerHTML = "";

    for (let i = 0; i < 5; i++) {

        const date = new Date(data.daily.time[i]);

        const day = date.toLocaleDateString("en-US", {
            weekday: "short"
        });

        const code = data.daily.weather_code[i];

        const info = conditions[code] || ["Unknown", "🌤️"];

        const max = Math.round(data.daily.temperature_2m_max[i]);

        const min = Math.round(data.daily.temperature_2m_min[i]);

        const card = document.createElement("div");

        card.className = "forecast-card";

        card.innerHTML = `
            <p class="forecast-day">${day}</p>

            <div class="forecast-icon">${info[1]}</div>

            <p class="forecast-temp">
                ${max}° / ${min}°
            </p>

            <p class="forecast-condition">
                ${info[0]}
            </p>
        `;

        forecast.appendChild(card);
    }
}


    // WEATHER ANIMATIONS
    const scene = document.getElementById("weather-scene");
    const caption = document.getElementById("scene-caption");

    scene.className = "weather-scene";


    if (code >= 95) {

        scene.classList.add("storm");

        caption.textContent = "A little thunder, a little wonder. ⛈️";

    }

    else if (
        [51, 53, 55, 56, 57, 61, 63, 65,
         66, 67, 80, 81, 82].includes(code)
    ) {

        scene.classList.add("rainy");

        caption.textContent =
            "Rainy days are better with little friends. 🐸";

    }

    else if ([45, 48, 3].includes(code)) {

        scene.classList.add("cloudy");

        caption.textContent = "Slow clouds, peaceful moments. ☁️";

    }

    else if ([71, 73, 75, 77, 85, 86].includes(code)) {

        scene.classList.add("cloudy");

        caption.textContent = "A little winter magic in the air. ❄️";

    }

    else if ([1, 2].includes(code)) {

        scene.classList.add("spring");

        caption.textContent = "A little sunshine makes flowers bloom. 🌸";

    }

    else {

        scene.classList.add("sunny");

        caption.textContent = "Sunshine and a refreshing lemonade. 🍋";

    }

}


// GET WEATHER DATA FOR A CITY
async function getWeather(latitude, longitude, cityName) {

    const status = document.getElementById("status");

    status.textContent = "Loading weather...";

    try {

        const params = new URLSearchParams({
            latitude: latitude,
            longitude: longitude,
            current: "temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m",
            timezone: "auto"
        });

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?" + params
        );

        if (!response.ok) {
            throw new Error("Weather data could not be loaded.");
        }

        const data = await response.json();

        showWeather(data.current, cityName);

        status.textContent = "Weather updated successfully!";

    }

    catch (error) {

        status.textContent = "Unable to load weather. Please try again.";

        console.error(error);

    }

}


// SEARCH CITY
async function searchCity() {

    const cityInput = document.getElementById("city-input");

    const city = cityInput.value.trim();

    const status = document.getElementById("status");

    const button = document.getElementById("search-button");

    if (!city) {

        status.textContent = "Please enter a city name.";

        return;

    }

    button.disabled = true;

    status.textContent = "Searching city...";

    try {

                const geoResponse = await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?name=" +
            encodeURIComponent(city) +
            "&count=1&language=en&format=json"
        );

        if (!geoResponse.ok) {
            throw new Error("City search failed.");
        }

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
            status.textContent = "City not found. Try another name.";
            return;
        }

        const place = geoData.results[0];

        const cityName = place.name +
            (place.admin1 ? ", " + place.admin1 : "") +
            (place.country ? ", " + place.country : "");

        await getWeather(
            place.latitude,
            place.longitude,
            cityName
        );

    } catch (error) {
        status.textContent = "Something went wrong. Please try again.";
        console.error(error);

    } finally {
        button.disabled = false;
    }
}


// SEARCH BUTTON EVENT
document.getElementById("search-form").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();
        searchCity();
    }
);


// LOAD DEFAULT CITY WEATHER
loadWeather();
// LOAD DEFAULT CITY WEATHER
getWeather(28.6139, 77.2090, "New Delhi, India");

</script>
</body>
</html>
